<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cho cá ăn">
<meta name="theme-color" content="#0B2227">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Bể cá</title>
<style>
:root{--bg:#0B2227;--surf:#12343B;--line:#1F4A53;--txt:#E6F3F1;--dim:#8FB3B5;--koi:#FF6A2B;--ok:#58D6A4;--warn:#F2C14E;--bad:#FF7B7B}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.45 ui-rounded,"SF Pro Rounded",system-ui,-apple-system,sans-serif}
body{min-height:100%;padding:calc(env(safe-area-inset-top,0px) + 10px) 14px calc(env(safe-area-inset-bottom,0px) + 20px);max-width:480px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
h1{font-size:20px;margin:0;font-weight:700}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--dim)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--dim)}
.on .dot{background:var(--ok)}.warn .dot{background:var(--warn)}.bad .dot{background:var(--bad)}
button{font:inherit;color:inherit}
.mbtn{background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:9px 14px;font-weight:600;cursor:pointer}
canvas{display:block;width:100%;aspect-ratio:6/5;border-radius:22px;background:var(--bg);touch-action:manipulation}
.next{text-align:center;color:var(--dim);margin:10px 0;min-height:1.5em;font-variant-numeric:tabular-nums}
.next b{color:var(--txt)}
#feed{position:relative;display:block;width:100%;height:64px;border-radius:32px;border:1px solid var(--line);background:var(--surf);overflow:hidden;font-weight:700;font-size:18px;cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#feed .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--koi)}
#feed span{position:relative;z-index:1}
#feed.off{opacity:.45;cursor:not-allowed}
#feed.stop{background:var(--bad);color:#2a0a0a}
.hint{text-align:center;color:var(--dim);font-size:12px;margin:8px 0 0}
dialog{background:var(--bg);color:var(--txt);border:0;padding:0;width:100%;max-width:480px;height:100%;max-height:100%;margin:0 auto}
dialog::backdrop{background:#000b}
.sheet{padding:calc(env(safe-area-inset-top,0px) + 12px) 16px calc(env(safe-area-inset-bottom,0px) + 24px)}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.tabs{display:flex;gap:6px;background:var(--surf);padding:4px;border-radius:14px;margin-bottom:14px}
.tabs button{flex:1;border:0;background:none;padding:9px 4px;border-radius:10px;font-weight:600;color:var(--dim);cursor:pointer}
.tabs button.a{background:var(--line);color:var(--txt)}
.pn{display:none}.pn.a{display:block}
.card{background:var(--surf);border-radius:18px;padding:4px 16px;margin-bottom:14px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}
input[type=time]{font:inherit;font-size:20px;font-weight:700;background:var(--bg);color:var(--txt);border:1px solid var(--line);border-radius:12px;padding:6px 10px;font-variant-numeric:tabular-nums}
.step{display:flex;align-items:center;gap:10px}
.step button{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--bg);font-size:20px;cursor:pointer}
.step b{min-width:2ch;text-align:center;font-size:18px}.step small{color:var(--dim);width:3.2ch}
.sw{appearance:none;-webkit-appearance:none;width:51px;height:31px;border-radius:16px;background:var(--line);position:relative;transition:background .2s;margin:0;flex:none}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;transition:transform .2s}
.sw:checked{background:var(--ok)}.sw:checked::after{transform:translateX(20px)}
.note{color:var(--dim);font-size:13px;margin:0 4px 14px}
ol{list-style:none;margin:0;padding:0}
li{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
li:last-child{border:0}li time{color:var(--dim);white-space:nowrap}
label.f{display:block;font-size:13px;color:var(--dim);margin:12px 0 4px}
input[type=text],input[type=password],input[type=url]{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surf);color:var(--txt);font:inherit;font-size:16px}
.pri{width:100%;margin-top:16px;padding:13px;border-radius:14px;border:0;background:var(--koi);color:#1b0a02;font-weight:700;cursor:pointer}
.ghost{width:100%;margin-top:10px;padding:12px;border-radius:14px;border:1px solid var(--line);background:none;cursor:pointer}
.dis{opacity:.4}
</style>
</head>
<body>
<header>
  <div><h1>Bể cá</h1><span class="pill" id="pill"><i class="dot"></i><span id="pt">Đang kết nối…</span></span></div>
  <button class="mbtn" id="open">☰ Menu</button>
</header>

<canvas id="scene" aria-label="Bể cá"></canvas>
<p class="next" id="next"></p>
<button id="feed" class="off"><i class="fill"></i><span id="ft">Chưa sẵn sàng</span></button>
<p class="hint" id="hint"></p>

<dialog id="menu"><div class="sheet">
  <div class="top"><h1>Cài đặt</h1><button class="mbtn" id="close">Xong</button></div>
  <div class="tabs"><button data-t="t1" class="a">Hẹn giờ</button><button data-t="t2">Nhật ký</button><button data-t="t3">Kết nối</button></div>

  <div class="pn a" id="t1">
    <section class="card">
      <label class="row"><span>Tự động cho ăn</span><input type="checkbox" class="sw" id="auto"></label>
    </section>
    <p class="note" id="sync">Chưa có dữ liệu từ máy.</p>
    <section class="card" id="slots"></section>
    <section class="card">
      <div class="row"><span>Motor chạy</span><div class="step"><button data-k="s" data-d="-1">−</button><b id="s">–</b><small>giây</small><button data-k="s" data-d="1">+</button></div></div>
      <div class="row"><span>Dự phòng khi mất giờ<br><small style="color:var(--dim)">cho ăn cách nhau</small></span><div class="step"><button data-k="h" data-d="-1">−</button><b id="h">–</b><small>giờ</small><button data-k="h" data-d="1">+</button></div></div>
    </section>
    <p class="note" id="meta"></p>
  </div>

  <div class="pn" id="t2">
    <section class="card"><ol id="log"></ol></section>
    <button class="ghost" id="clr">Xóa nhật ký</button>
  </div>

  <div class="pn" id="t3">
    <label class="f" for="url">Địa chỉ WebSocket (wss://…)</label>
    <input type="url" id="url" placeholder="wss://xxxx.emqxsl.com:8084/mqtt" autocapitalize="off" autocorrect="off">
    <label class="f" for="user">Tài khoản (dành cho app)</label>
    <input type="text" id="user" autocapitalize="off" autocorrect="off">
    <label class="f" for="pass">Mật khẩu</label>
    <input type="password" id="pass">
    <label class="f" for="id">Mã thiết bị (trùng DEVICE_ID trong code)</label>
    <input type="text" id="id" autocapitalize="off" autocorrect="off">
    <button class="pri" id="save">Lưu và kết nối</button>
  </div>
</div></dialog>

<script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script>
const $=s=>document.querySelector(s),two=n=>String(n).padStart(2,'0'),hm=m=>two(Math.floor(m/60))+':'+two(m%60);
const ls={get:k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let cfg=ls.get('cfg'),st=null,stAt=0,cli=null,conn='connecting',lastFed=0,localUntil=0,logs=ls.get('log')||[];
const T=x=>'fishfeeder/'+cfg.id+'/'+x;
const live=()=>conn==='ok'&&st&&st.online;
const act=()=>live()&&(st.feeding||Date.now()<localUntil);

/* ---------- Nhật ký ---------- */
const fmt=d=>two(d.getHours())+':'+two(d.getMinutes())+' '+two(d.getDate())+'/'+two(d.getMonth()+1);
function addLog(t){logs.unshift({t,at:Date.now()});logs=logs.slice(0,30);ls.set('log',logs);drawLog()}
function drawLog(){$('#log').innerHTML=logs.length?logs.map(l=>'<li><span>'+l.t+'</span><time>'+fmt(new Date(l.at))+'</time></li>').join(''):'<li><span>Chưa có sự kiện nào</span></li>'}
$('#clr').onclick=()=>{logs=[];ls.set('log',logs);drawLog()};

/* ---------- MQTT ---------- */
function send(m){if(cli&&cli.connected)cli.publish(T('cmd'),m,{qos:1,retain:false})}
function connect(){
  if(cli){try{cli.end(true)}catch(e){}cli=null}
  if(!cfg){openMenu('t3');return}
  conn='connecting';render();
  cli=mqtt.connect(cfg.url,{username:cfg.user,password:cfg.pass,clientId:'app-'+Math.random().toString(16).slice(2,10),reconnectPeriod:3000,connectTimeout:8000,clean:true});
  cli.on('connect',()=>{conn='ok';cli.subscribe(T('state'));render()});
  cli.on('close',()=>{conn='down';render()});
  cli.on('error',()=>{conn='down';render()});
  cli.on('message',(t,m)=>{try{onState(JSON.parse(m.toString()))}catch(e){}});
}
function onState(s){
  const p=st;
  if(p){
    if(!p.feeding&&s.feeding)addLog('Bắt đầu cho ăn');
    if(p.feeding&&!s.feeding)addLog(s.count>p.count?'Đã cho ăn xong':'Đã dừng motor');
    if(!p.online&&s.online)addLog('Máy đã kết nối');
    if(p.online&&!s.online)addLog(s.sleep?'Máy đi ngủ':'Máy mất kết nối');
  }
  if(s.feeding||(p&&p.feeding&&!s.feeding))localUntil=0;
  st=s;stAt=Date.now();render();
}

/* ---------- Giao diện chính ---------- */
function render(){
  let cls='',txt;
  if(conn==='connecting'){txt='Đang kết nối…';cls='warn'}
  else if(conn==='down'){txt='Chưa nối được máy chủ';cls='bad'}
  else if(!st){txt='Đang chờ máy…';cls='warn'}
  else if(st.sleep){txt='Máy đang ngủ';cls='warn'}
  else if(!st.online){txt='Máy ngoại tuyến';cls='bad'}
  else{txt='Máy trực tuyến';cls='on'}
  $('#pill').className='pill '+cls;$('#pt').textContent=txt;
  const fb=$('#feed');fb.classList.toggle('off',!live());fb.classList.toggle('stop',!!(live()&&st.feeding));
  $('#ft').textContent=!live()?'Chưa sẵn sàng':st.feeding?'Chạm để dừng':'Giữ để cho ăn';
  $('#hint').textContent=live()&&!st.feeding?'Giữ nút khoảng 1 giây để tránh bấm nhầm':'';
  if(st)fillMenu();
  tick();
}
function tick(){
  const n=$('#next');
  if(!live()){n.textContent='';return}
  if(st.feeding){n.textContent='Đang cho ăn…';return}
  const el=Math.floor((Date.now()-stAt)/1000);
  let h='';
  if(st.sync){const d=new Date((st.ts+el+25200)*1000);h='Giờ máy '+two(d.getUTCHours())+':'+two(d.getUTCMinutes())+' · '}
  if(!st.auto){n.textContent=h+'Tự động đang tắt';return}
  if(st.sync&&st.sl.every(v=>v<0)){n.textContent=h+'Chưa đặt giờ cho ăn';return}
  const r=Math.max(0,st.next-el);
  n.innerHTML=h+'Cho ăn sau <b>'+two(Math.floor(r/3600))+':'+two(Math.floor(r/60)%60)+':'+two(r%60)+'</b>';
}
setInterval(tick,1000);

/* Giữ để cho ăn */
const fb=$('#feed'),fill=fb.querySelector('.fill');let holdT=null;
const setFill=(w,d)=>{fill.style.transition='width '+d+'s linear';fill.style.width=w+'%'};
fb.addEventListener('pointerdown',()=>{
  if(!(live()&&!st.feeding))return;
  setFill(100,.9);
  holdT=setTimeout(()=>{holdT=null;lastFed=Date.now();localUntil=Date.now()+4000;send('FEED');setTimeout(()=>setFill(0,.3),400)},900)});
const rel=()=>{if(holdT){clearTimeout(holdT);holdT=null;setFill(0,.25)}};
['pointerup','pointercancel','pointerleave'].forEach(e=>fb.addEventListener(e,rel));
fb.addEventListener('click',()=>{if(st&&st.feeding&&Date.now()-lastFed>1500)send('STOP')});
fb.addEventListener('contextmenu',e=>e.preventDefault());

/* ---------- Menu cài đặt ---------- */
const M=$('#menu');
function openMenu(t){tab(t||'t1');const c=cfg||{};$('#url').value=c.url||'';$('#user').value=c.user||'';$('#pass').value=c.pass||'';$('#id').value=c.id||'';M.showModal()}
function tab(t){document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('a',b.dataset.t===t));document.querySelectorAll('.pn').forEach(p=>p.classList.toggle('a',p.id===t))}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>tab(b.dataset.t));
$('#open').onclick=()=>openMenu('t1');$('#close').onclick=()=>M.close();
$('#save').onclick=()=>{const c={url:$('#url').value.trim(),user:$('#user').value.trim(),pass:$('#pass').value,id:$('#id').value.trim().toLowerCase()};
  if(!c.url||!c.id)return;cfg=c;ls.set('cfg',c);st=null;M.close();connect()};

$('#slots').innerHTML=[0,1,2,3].map(i=>'<div class="row" data-i="'+i+'"><b>Giờ '+(i+1)+'</b><input type="time" value="'+(i?'18:00':'07:00')+'"><input type="checkbox" class="sw"></div>').join('');
const slotSend=r=>{const i=r.dataset.i,on=r.querySelector('.sw').checked,v=r.querySelector('input[type=time]').value||'07:00';send(on?'SLOT:'+i+':'+v:'SLOT:'+i+':OFF')};
let dbT={};
document.querySelectorAll('#slots .row').forEach(r=>{
  r.querySelector('.sw').onchange=()=>{r.classList.toggle('dis',!r.querySelector('.sw').checked);slotSend(r)};
  r.querySelector('input[type=time]').onchange=()=>{clearTimeout(dbT[r.dataset.i]);dbT[r.dataset.i]=setTimeout(()=>{if(r.querySelector('.sw').checked)slotSend(r)},500)}});
$('#auto').onchange=e=>send('AUTO:'+(e.target.checked?1:0));
const LIM={h:[1,24,'INTERVAL'],s:[1,30,'MOTOR']};
document.querySelectorAll('.step button').forEach(b=>b.onclick=()=>{
  if(!st)return;const k=b.dataset.k,[lo,hi,c]=LIM[k],v=Math.min(hi,Math.max(lo,st[k]+Number(b.dataset.d)));
  if(v===st[k])return;st[k]=v;fillMenu();send(c+':'+v)});
function fillMenu(){
  $('#auto').checked=!!st.auto;$('#h').textContent=st.h;$('#s').textContent=st.s;
  document.querySelectorAll('#slots .row').forEach(r=>{
    const v=st.sl[r.dataset.i],t=r.querySelector('input[type=time]'),c=r.querySelector('.sw');
    c.checked=v>=0;r.classList.toggle('dis',v<0);
    if(v>=0&&document.activeElement!==t)t.value=hm(v)});
  $('#sync').textContent=st.sync?'Giờ trên máy tự đồng bộ từ internet (GMT+7). Mỗi giờ hẹn chạy mỗi ngày.':'Máy chưa lấy được giờ internet nên đang dùng chu kỳ dự phòng.';
  $('#meta').textContent='Đã cho ăn '+st.count+' lần từ lúc bật nguồn · WiFi '+st.rssi+' dBm';
}

/* ---------- Bể cá (canvas) ---------- */
const cv=$('#scene'),cx=cv.getContext('2d'),W=360,H=300,RIM=44,JX=268,TX=JX-30,GP={x:JX+14,y:100};
const R=(a,b)=>a+Math.random()*(b-a);
const COL=['#FF8A3D','#FFC24B','#FF6A6A','#7FD6FF','#FFB38A','#F2E16B','#FF9AD0'];
const fish=COL.map((c,i)=>({x:R(50,310),y:R(70,230),vx:0,vy:0,tx:R(40,320),ty:R(62,235),tt:R(1,4),c,s:R(.8,1.3),ph:R(0,6),dir:1,ox:R(-30,30),oy:R(-22,22)}));
const bub=Array.from({length:7},()=>({x:R(40,320),y:R(60,250),r:R(1.5,3.5),v:R(12,28)}));
let pel=[],ph='idle',pt=0,lid=0,px=-30,sp=0,ts=0,last=0;
function fitCanvas(){const r=Math.min(devicePixelRatio||1,3),w=cv.clientWidth;cv.width=w*r;cv.height=w*H/W*r}
addEventListener('resize',fitCanvas);

function step(dt){
  ts+=dt;pt+=dt;const a=act();
  if(a&&(ph==='idle'||ph==='back'||ph==='close')){ph='run';pt=0}
  else if(!a&&(ph==='run'||ph==='open'||ph==='feed')){ph='close';pt=0}
  if(ph==='run'){px+=150*dt;if(px>=TX){px=TX;ph='open';pt=0}}
  else if(ph==='open'){lid=Math.min(1,pt/.5);if(pt>.5){ph='feed';pt=0;sp=0}}
  else if(ph==='feed'){sp-=dt;if(sp<=0){sp=.12;pel.push({x:JX+R(4,26),y:RIM+3,vx:R(-8,8),vy:R(25,50)})}}
  else if(ph==='close'){lid=Math.max(0,lid-dt*2.2);if(lid===0&&pt>.4)ph='back'}
  else if(ph==='back'){px-=150*dt;if(px<=-30){px=-30;ph='idle'}}
  const gather=ph==='open'||ph==='feed'||pel.length>0;
  pel.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy=Math.min(p.vy+dt*10,55)});
  fish.forEach(f=>{
    let tx=f.tx,ty=f.ty,spd=24+f.s*10;
    if(gather){tx=GP.x+f.ox;ty=GP.y+f.oy;spd=95;
      for(let i=pel.length-1;i>=0;i--){const p=pel[i];if(Math.hypot(p.x-f.x,p.y-f.y)<9){pel.splice(i,1);break}}}
    else{f.tt-=dt;if(f.tt<=0||Math.hypot(tx-f.x,ty-f.y)<10){f.tx=R(40,320);f.ty=R(62,235);f.tt=R(1.5,4)}}
    const d=Math.hypot(tx-f.x,ty-f.y)||1,k=Math.min(1,d/20);
    f.vx+=((tx-f.x)/d*spd*k-f.vx)*Math.min(1,dt*2.5);f.vy+=((ty-f.y)/d*spd*k-f.vy)*Math.min(1,dt*2.5);
    f.x+=f.vx*dt;f.y+=f.vy*dt;if(Math.abs(f.vx)>4)f.dir=f.vx>0?1:-1;
    f.w=gather?14:7;
  });
  pel=pel.filter(p=>p.y<248);
  bub.forEach(b=>{b.y-=b.v*dt;if(b.y<50){b.y=250;b.x=R(40,320)}});
}
function ln(a,b,c,d){cx.beginPath();cx.moveTo(a,b);cx.lineTo(c,d);cx.stroke()}
function draw(){
  const w=cv.width,s=w/W;cx.setTransform(s,0,0,s,0,0);cx.clearRect(0,0,W,H);
  cx.fillStyle='#12343B';cx.fillRect(0,262,W,38);                       // bàn
  const g=cx.createLinearGradient(0,RIM,0,262);g.addColorStop(0,'#237A89');g.addColorStop(1,'#0C3038');
  cx.fillStyle=g;cx.fillRect(24,RIM,312,218);                           // nước
  cx.fillStyle='#ffffff40';bub.forEach(b=>{cx.beginPath();cx.arc(b.x,b.y,b.r,0,7);cx.fill()});
  cx.strokeStyle='#2E9E6B';cx.lineWidth=4;cx.lineCap='round';
  [60,110,310].forEach((x,i)=>{cx.beginPath();cx.moveTo(x,250);for(let y=1;y<=5;y++)cx.lineTo(x+Math.sin(ts*1.6+i+y*.7)*7*y/5,250-y*16);cx.stroke()});
  fish.forEach(f=>{
    cx.save();cx.translate(f.x,f.y);cx.scale(f.dir*f.s,f.s);
    const wag=Math.sin(ts*f.w+f.ph)*.45;
    cx.fillStyle=f.c;cx.beginPath();cx.ellipse(0,0,13,7.5,0,0,7);cx.fill();
    cx.beginPath();cx.moveTo(-10,0);cx.lineTo(-22,-7+wag*9);cx.lineTo(-22,7+wag*9);cx.closePath();cx.fill();
    cx.fillStyle='#fff';cx.beginPath();cx.arc(7,-2,2.6,0,7);cx.fill();
    cx.fillStyle='#0B2227';cx.beginPath();cx.arc(7.6,-2,1.3,0,7);cx.fill();
    cx.restore()});
  cx.fillStyle='#C98F52';pel.forEach(p=>{cx.beginPath();cx.arc(p.x,p.y,2.2,0,7);cx.fill()});
  cx.fillStyle='#C9A36B';cx.fillRect(24,250,312,12);                    // cát
  cx.strokeStyle='#4FA7B5';cx.lineWidth=3;cx.strokeRect(24,RIM,312,218);// khung bể
  cx.strokeStyle='#8FB3B5';cx.lineWidth=3;ln(0,RIM,W,RIM);              // thanh vắt trên bể
  // hũ thức ăn + nắp
  cx.fillStyle='#E6F3F1';cx.fillRect(JX,RIM-28,32,28);cx.fillStyle='#FF6A2B';cx.fillRect(JX,RIM-18,32,8);
  cx.save();cx.translate(JX,RIM-28);cx.rotate(-lid*1.25);cx.fillStyle='#8FB3B5';cx.fillRect(0,-5,32,5);cx.restore();
  // người
  const mv=ph==='run'||ph==='back',sw=mv?Math.sin(ts*16)*7:0,up=ph==='open'||ph==='feed';
  cx.save();cx.translate(px,RIM);if(ph==='back')cx.scale(-1,1);cx.lineWidth=4;cx.lineCap='round';
  cx.strokeStyle='#2d4f87';ln(0,-12,-sw,0);ln(0,-12,sw,0);
  cx.strokeStyle='#FF6A2B';ln(0,-12,0,-24);
  ln(0,-22,up?12:-sw*.8,up?-31:-11);ln(0,-22,up?7:sw*.8,up?-25:-11);
  cx.fillStyle='#f2c9a0';cx.beginPath();cx.arc(0,-30,5.5,0,7);cx.fill();cx.restore();
  if(!live()){
    cx.fillStyle='#0B2227A0';cx.fillRect(0,0,W,H);cx.fillStyle='#E6F3F1';cx.font='600 17px ui-rounded,system-ui,sans-serif';cx.textAlign='center';
    cx.fillText(conn==='connecting'?'Đang kết nối…':conn==='down'?'Chưa nối được máy chủ':st&&st.sleep?'Máy đang ngủ':st?'Máy ngoại tuyến':'Đang chờ máy…',W/2,H/2+60)}
}
function loop(t){const dt=Math.min(.05,(t-last)/1000||0);last=t;step(dt);draw();requestAnimationFrame(loop)}

document.addEventListener('visibilitychange',()=>{if(!document.hidden&&cfg&&(!cli||!cli.connected))connect()});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
fitCanvas();drawLog();render();connect();requestAnimationFrame(loop);
</script>
